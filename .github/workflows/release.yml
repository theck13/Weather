name: WeatherMaster Signed Release

on:
  workflow_dispatch:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      SOURCE_ACCU_WEATHER: ${{ secrets.SOURCE_ACCU_WEATHER }}
      SOURCE_GEO_USERNAME: ${{ secrets.SOURCE_GEO_USERNAME }}
      SOURCE_METEO_FRANCE: ${{ secrets.SOURCE_METEO_FRANCE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21.0.7"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode keystore
        run: |
          mkdir keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore/release.jks

      - name: Verify environment
        run: |
          java -version
          ./gradlew --version

      - name: Build signed APK
        run: |
          ./gradlew \
            --no-daemon \
            --no-build-cache \
            -PSOURCE_ACCU_WEATHER="${{ secrets.SOURCE_ACCU_WEATHER }}" \
            -PSOURCE_GEO_USERNAME="${{ secrets.SOURCE_GEO_USERNAME }}" \
            -PSOURCE_METEO_FRANCE="${{ secrets.SOURCE_METEO_FRANCE }}" \
            clean assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-apk
          path: app/build/outputs/apk/release/*.apk
